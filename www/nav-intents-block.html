<script>
/* استقبال المواقع من التطبيقات الأخرى (geo: / google.navigation: / روابط خرائط جوجل / روابط Zoom).
   استبدل بهذا الكتلة كتلة <script> القديمة التي تبدأ بـ: if (!window.Capacitor || !window.Capacitor.isNativePlatform ...) */
(function() {
  if (!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return;

  const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
  const LL = /(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)/;
  function pair(str) {
    const m = LL.exec(str || '');
    if (!m) return null;
    const lat = num(m[1]), lng = num(m[2]);
    if (lat === null || lng === null || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    if (lat === 0 && lng === 0) return null;
    return { lat, lng };
  }

  // يرجع { lat, lng } أو { query } (اسم مكان للبحث) أو null
  function parseTarget(url) {
    if (!url) return null;
    let u = String(url).trim();
    try { u = decodeURIComponent(u); } catch (e) {}

    // geo:lat,lng?q=...  |  geo:0,0?q=lat,lng(label)  |  geo:0,0?q=اسم المكان
    if (/^geo:/i.test(u)) {
      const body = u.slice(4);
      const q = /[?&]q=([^&]*)/i.exec(body);
      if (q) { const p = pair(q[1]); if (p) return p; const name = q[1].replace(/\+/g, ' ').trim(); if (name) { const head = pair(body.split('?')[0]); return head || { query: name }; } }
      const p = pair(body.split('?')[0]);
      if (p) return p;
      return null;
    }

    // google.navigation:q=lat,lng  أو  q=اسم
    if (/^google\.navigation:/i.test(u)) {
      const q = /[?&:]q=([^&]*)/i.exec(u);
      if (q) { const p = pair(q[1]); if (p) return p; const name = q[1].replace(/\+/g, ' ').trim(); if (name) return { query: name }; }
      return null;
    }

    // روابط الويب: خرائط جوجل وغيرها
    let host = '';
    try { host = new URL(u).hostname; } catch (e) {}
    if (/(^|\.)(google\.[a-z.]+|goo\.gl|maps\.apple\.com)$/i.test(host)) {
      let m;
      if ((m = /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/.exec(u))) { const p = pair(m[1] + ',' + m[2]); if (p) return p; }
      if ((m = /@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/.exec(u))) { const p = pair(m[1] + ',' + m[2]); if (p) return p; }
      for (const key of ['destination', 'daddr', 'q', 'query', 'll', 'sll', 'center']) {
        const r = new RegExp('[?&]' + key + '=([^&#]*)', 'i').exec(u);
        if (r) { const p = pair(r[1]); if (p) return p; }
      }
      const nameQ = /[?&](?:q|query|destination|daddr)=([^&#]*)/i.exec(u);
      if (nameQ) { const name = nameQ[1].replace(/\+/g, ' ').trim(); if (name && !LL.test(name)) return { query: name }; }
      if ((m = /\/maps\/place\/([^/@?]+)/i.exec(u))) { const name = m[1].replace(/\+/g, ' ').trim(); if (name) return { query: name }; }
    }
    return null;
  }

  function whenReady(fn) {
    const t = () => {
      if (typeof userPos !== 'undefined' && userPos && typeof setDestinationAt === 'function' && map && map.loaded()) fn();
      else setTimeout(t, 500);
    };
    t();
  }

  function goToCoords(c) {
    whenReady(() => setDestinationAt({ lng: c.lng, lat: c.lat }));
  }

  function goToQuery(name) {
    whenReady(async () => {
      try {
        showGPSToast('جاري البحث عن: ' + name);
        const item = await searchDestination(name);
        hideGPSToast();
        if (!item) { showGPSToast('لم يتم العثور على المكان'); setTimeout(hideGPSToast, 2200); return; }
        const parts = String(item.display_name || name).split(',');
        setDestinationAt({ lng: parseFloat(item.lon), lat: parseFloat(item.lat) }, parts.slice(0, 2).join('، '));
      } catch (e) {}
    });
  }

  function handleUrl(url) {
    if (!url) return;
    // روابط التطبيق نفسه: ?dest=lat,lng  و  ?live=id
    try {
      const u = new URL(url);
      const d = u.searchParams.get('dest');
      if (d) { const p = pair(d); if (p) { goToCoords(p); return; } }
      const lv = u.searchParams.get('live');
      if (lv) {
        const w = () => { if (typeof watchLiveShare === 'function' && map.loaded()) watchLiveShare(lv); else setTimeout(w, 500); };
        w(); return;
      }
    } catch (e) {}
    const t = parseTarget(url);
    if (!t) return;
    if (t.query) goToQuery(t.query); else goToCoords(t);
  }

  function init() {
    const App = Capacitor.Plugins && Capacitor.Plugins.App;
    if (!App) return;
    App.addListener('appUrlOpen', (data) => { if (data && data.url) handleUrl(data.url); });
    App.getLaunchUrl().then((r) => { if (r && r.url) handleUrl(r.url); }).catch(() => {});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
  else init();
})();
</script>
